<!-- 不蒜子访问统计 v3.6.9 · 官方文档 https://www.busuanzi.cc/ -->
<script src="https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>

<p class="footer-stats">
	<span>今日访问量 <span id="busuanzi_today_pv">—</span> 次</span>
	<span>| 本站总访问量 <span id="busuanzi_site_pv">—</span> 次</span>
	<span>| 访客人数 <span id="busuanzi_site_uv">—</span> 人</span>
</p>
<!-- 建站时间统计 -->
<p class="footer-stats">
	<span id="site-runtime">本站已存活 ... 天</span>
</p>

<script>
	(function () {
		var startTime = new Date("2026-09-12T00:00:00+08:00").getTime();
		function updateRuntime() {
			var now = Date.now();
			var diff = now - startTime;
			if (diff < 0) diff = 0;
			var days = Math.floor(diff / (1000 * 60 * 60 * 24));
			var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
			var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
			var seconds = Math.floor((diff % (1000 * 60)) / 1000);
			document.getElementById("site-runtime").textContent =
				"本站已存活 " + days + " 天 " + hours + " 小时 " + minutes + " 分 " + seconds + " 秒";
		}
		updateRuntime();
		setInterval(updateRuntime, 1000);
	})();
</script>
