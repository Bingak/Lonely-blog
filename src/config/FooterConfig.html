<!-- 不蒜子访问统计 -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<p class="footer-stats">
	<span id="busuanzi_container_site_pv">
		本站总访问量 <span id="busuanzi_value_site_pv"></span> 次
	</span>
	<span id="busuanzi_container_site_uv">
		| 访客人数 <span id="busuanzi_value_site_uv"></span> 人
	</span>
</p>
<!-- 建站时间统计 -->
<p class="footer-stats">
	<span id="site-runtime">本站已运行 ... 天</span>
</p>

<script>
	(function () {
		var startTime = new Date("2026-09-12T07:00:00+08:00").getTime();
		function updateRuntime() {
			var now = Date.now();
			var diff = now - startTime;
			if (diff < 0) diff = 0;
			var days = Math.floor(diff / (1000 * 60 * 60 * 24));
			var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
			var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
			var seconds = Math.floor((diff % (1000 * 60)) / 1000);
			document.getElementById("site-runtime").textContent =
				"本站已运行 " + days + " 天 " + hours + " 小时 " + minutes + " 分 " + seconds + " 秒";
		}
		updateRuntime();
		setInterval(updateRuntime, 1000);
	})();
</script>
